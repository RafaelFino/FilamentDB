        dry_hours: 8.0
        recommended_use: Mechanical parts
        status: Active
      - sku: PETG-BLK-1K
        color_name: Black
        hex: '#111111'
        rgb:
        - 17
        - 17
        - 17
        finish: Semi-Gloss
        diameter_mm: 1.75
        weight_g: 1000
        dry_temp: 65
        dry_hours: 8.0
        recommended_use: Mechanical parts
        status: Active
    - line: Hyper PETG Line
      commercial_name: Hyper PETG
      profile_name: Creality Hyper PETG
      nozzle:
        initial: 250
        min: 240
        max: 260
      bed:
        initial: 85
        temp: 85
      flow_ratio: 0.97
      max_volumetric_speed: 23
      recommendation: >
        PETG de alta velocidade da Creality (MVS 23) — aproveita a K2 para peças funcionais rápidas.
        Mesma resistência do CR PETG, mas com fluxo bem maior. Requer bed mais quente (85°C).
        Quando escolher: peças mecânicas em série ou grandes onde você quer PETG sem perder tempo.
        Seque antes: PETG úmido faz stringing e perde qualidade.
      color: Natural
      surface_finish: Standard
      drying_temperature: 65
      drying_time: 8.0
      variants:
      - sku: PETG-WHT-1K
        color_name: White
        hex: '#F5F5F5'
        rgb:
        - 245
        - 245
        - 245
        finish: Semi-Gloss
        diameter_mm: 1.75
        weight_g: 1000
        dry_temp: 65
        dry_hours: 8.0
        recommended_use: Mechanical parts
        status: Active
      - sku: PETG-BLK-1K
        color_name: Black
        hex: '#111111'
        rgb:
        - 17
        - 17
        - 17
        finish: Semi-Gloss
        diameter_mm: 1.75
        weight_g: 1000
        dry_temp: 65
        dry_hours: 8.0
        recommended_use: Mechanical parts
        status: Active
  ABS:
    profiles:
    - line: ABS Industrial Line
      commercial_name: ABS
      profile_name: Creality ABS
      nozzle:
        initial: 250
        min: 240
        max: 265
      bed:
        initial: 100
        temp: 100
      flow_ratio: 1.0
      max_volumetric_speed: 12
      recommendation: >
        ABS industrial da Creality para peças que enfrentam calor (~100°C) e impacto. Na K2
        exige câmara fechada e cama 100°C, senão empena e delamina. Libera VOC — ventile.
        Quando escolher: peças funcionais quentes de uso interno. Para exterior/sol, use ASA
        (o ABS amarela e fragiliza no UV).
      color: Black
      surface_finish: Standard
      drying_temperature: 80
      drying_time: 6.0
      variants:
      - sku: ABS-WHT-1K
        color_name: White
        hex: '#F5F5F5'
        rgb:
        - 245
        - 245
        - 245
        finish: Gloss
        diameter_mm: 1.75
        weight_g: 1000
        dry_temp: 80
        dry_hours: 6.0
        recommended_use: Engineering
        status: Active
  ASA:
    profiles:
    - line: ASA Outdoor Line
      commercial_name: ASA
      profile_name: Creality ASA
      nozzle:
        initial: 255
        min: 245
        max: 270
      bed:
        initial: 100
        temp: 100
      flow_ratio: 1.0
      max_volumetric_speed: 12
      recommendation: >
        ASA é o material para peças externas: mesma resistência térmica/mecânica do ABS, mas
        não amarela nem fragiliza ao sol. Comporta-se como ABS na impressão — câmara fechada e
        cama 100°C, propenso a warping. Quando escolher: suportes de câmera, peças de jardim,
        qualquer coisa exposta ao tempo. Se a peça fica dentro de casa, ABS resolve mais barato.
      color: White
      surface_finish: Standard
      drying_temperature: 80
      drying_time: 6.0
      variants:
      - sku: ASA-BLK-1K
        color_name: Black
        hex: '#111111'
        rgb:
        - 17
        - 17
        - 17
        finish: Matte
        diameter_mm: 1.75
        weight_g: 1000
        dry_temp: 80
        dry_hours: 6.0
        recommended_use: Outdoor UV
        status: Active
  TPU:
    profiles:
    - line: TPU Flex Line
      commercial_name: TPU 95A
      profile_name: Creality TPU
      nozzle:
        initial: 225
        min: 215
        max: 235
      bed:
        initial: 50
        temp: 50
      flow_ratio: 1.05
      max_volumetric_speed: 10
      recommendation: >
        TPU 95A da Creality para peças flexíveis. MVS 10 (um pouco acima de outros TPU),
        o Direct Drive da K2 ajuda, mas ainda pede velocidade baixa e retração mínima.
        Quando escolher: juntas, protetores, amortecedores, pés. Seque antes — TPU pega umidade
        rápido e bolha. Firme-flexível (95A), não é mole tipo borracha.
      color: Natural
      surface_finish: Flexible
      drying_temperature: 50
      drying_time: 8.0
      variants:
      - sku: TPU95-BLK-1K
        color_name: Black
        hex: '#111111'
        rgb:
        - 17
        - 17
        - 17
        finish: Semi-Gloss
        diameter_mm: 1.75
        weight_g: 1000
        dry_temp: 50
        dry_hours: 8.0
        recommended_use: Flexible
        status: Active
