  positioning: flexible
  difficulty: 80
  target_use: flexible_parts
  notes: Baixa velocidade, alta elasticidade
  color_options:
  - Natural
  - Black
  - Gray
materials:
  PLA:
    profiles:
    - line: Hyper Series
      commercial_name: Hyper PLA
      profile_name: Creality Hyper PLA
      notes: >
        Specs oficiais confirmadas: nozzle 190-230°C, bed 25-60°C, speed 40-600mm/s,
        density 1.24 g/cm³, tensile 52.99 MPa, elongation 6.3%, tolerância ±0.02mm.
      nozzle:
        initial: 220
        min: 190
        max: 230
      bed:
        initial: 60
        temp: 60
      flow_ratio: 1.0
      max_volumetric_speed: 23
      density: 1.24
      tensile_strength_mpa: 52.99
      elongation_at_break_pct: 6.3
      diameter_tolerance: "1.75±0.02mm"
      recommendation: >
        PLA de referência da Creality, feito para a própria K2 (datasheet cita 600mm/s; MVS 23).
        Perfil de fábrica bem calibrado, tende a "só funcionar". Bom tensile para PLA (53 MPa).
        Quando escolher: default de produção rápida na K2 quando você quer o menor atrito possível.
        Continua PLA — sem calor. Para acabamento estético, prefira um matte/velvet de outra marca.
      color: Natural
      surface_finish: Standard
      drying_temperature: 50
      drying_time: 8.0
      variants:
      - sku: HPLA-WHT-1K
        color_name: White
        hex: '#F5F5F5'
