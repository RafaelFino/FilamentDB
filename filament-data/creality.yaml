    - line: CR Series
      commercial_name: CR PLA
      profile_name: Creality CR PLA
      notes: >
        Filamento propenso a warping. Usar perfil Safe com brim obrigatório e cola na mesa.
        Nozzle a 215°C para fusão adequada entre camadas. Bed 65°C mantém adesão.
      nozzle:
        initial: 215
        min: 205
        max: 220
      bed:
        initial: 65
        temp: 65
      flow_ratio: 0.98
      max_volumetric_speed: 12
      recommendation: >
        PLA legado da Creality, mais problemático que o Hyper: propenso a warping e com fusão
        entre camadas exigente. Use perfil Safe, brim obrigatório e cola na mesa, bed 65°C.
        MVS baixo (12). Quando escolher: só se já tiver em estoque — não é a primeira opção.
        Para PLA sem dor de cabeça na K2, prefira Hyper PLA.
      color: Natural
      surface_finish: Standard
      drying_temperature: 50
      drying_time: 6.0
    - line: Ender Series
      commercial_name: Ender PLA
      profile_name: Creality Ender PLA
      nozzle:
        initial: 210
        min: 200
        max: 220
      bed:
        initial: 55
        temp: 55
      flow_ratio: 1.02
      max_volumetric_speed: 12
      recommendation: >
        PLA de entrada da Creality, o mais tolerante da marca — perdoa temperatura e velocidade
        fora do ponto ideal. MVS baixo (12), acabamento e resistência comuns. Quando escolher:
        aprendizado, calibração de máquina, peças descartáveis. Para produção séria na K2,
        o Hyper PLA rende muito mais.
      color: Natural
      surface_finish: Standard
  PETG:
    profiles:
    - line: CR PETG Line
      commercial_name: CR PETG
      profile_name: Creality CR PETG
      nozzle:
        initial: 245
        min: 235
        max: 255
      bed:
        initial: 80
        temp: 80
      flow_ratio: 0.98
      max_volumetric_speed: 15
      recommendation: >
        PETG padrão da Creality (linha CR) para peças mecânicas. Fluxo comum (MVS 15),
        confiável e sem surpresas. Gruda em suporte como todo PETG — use gaps generosos.
        Quando escolher: peças funcionais utilitárias sem pressa. Se quiser velocidade,
        o Hyper PETG entrega quase o dobro de fluxo.
      color: Natural
      surface_finish: Standard
      drying_temperature: 65
      drying_time: 8.0
      variants:
      - sku: PETG-WHT-1K
        color_name: White
        hex: '#F5F5F5'
        rgb:
