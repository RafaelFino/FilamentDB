manufacturer:
  name: Prusament
  country: Czech Republic
  website: https://www.prusa3d.com
lines:
- name: Precision Line
  description: Ultra consistent filaments with tight tolerances
  positioning: premium
  difficulty: 30
  target_use: precision_printing
  tier: professional
  category: general
  finish: standard
  notes: Padrão ouro de consistência global
  color_options:
  - Natural
  - Black
- name: Engineering Line
  description: Advanced materials like PETG, ASA, PC blends
  positioning: engineering
  difficulty: 65
  target_use: mechanical_heat_resistant
  tier: professional
  category: high_temp
  finish: standard
  notes: Altíssima confiabilidade técnica
  color_options:
  - Black
  - White
  - Natural
- name: Lightweight Line
  description: PLA de baixo peso (foaming) para aeromodelismo
  positioning: specialty
  difficulty: 70
  target_use: lightweight_rc
  tier: professional
  category: specialty
  finish: matte
  notes: PLA Lightweight / PolyLight da Prusa, expande 2,3-3x (foaming).
  color_options:
  - Natural
  - Orange
materials:
  PLA-LW:
    profiles:
    - line: Lightweight Line
      commercial_name: PLA Lightweight
      profile_name: Prusament PLA Lightweight
      export: false
      notes: >
        PLA Lightweight / PolyLight da Prusa (foaming): expande 2,3-3x, nozzle
        recomendado 210-250°C. Flow reduzido controla a expansão. Reescrito para licença.
      nozzle:
        initial: 230
        min: 210
        max: 250
      bed:
        initial: 60
        temp: 60
      flow_ratio: 0.55
      max_volumetric_speed: 7
      density: 0.6
      color: Natural
      surface_finish: Matte
      drying_temperature: 55
      drying_time: 8.0
  PLA:
    profiles:
    - line: Precision Line
      commercial_name: PLA
      profile_name: Prusament PLA
      nozzle:
        initial: 215
        min: 205
        max: 230
      bed:
        initial: 55
        temp: 55
      flow_ratio: 1.0
      # MVS 18 -> 15: sem fonte de MVS; classe do material (Orca mvs_default), política do menor valor
      max_volumetric_speed: 15
      diameter: 1.75
      drying_temperature: 50
      drying_time: 8.0
      recommendation: Consistência quase perfeita entre lotes
      color: Natural
      surface_finish: Standard
  PETG:
    profiles:
    - line: Engineering Line
      commercial_name: PETG
      profile_name: Prusament PETG
      nozzle:
        initial: 240
        min: 230
        max: 255
      bed:
        initial: 80
        temp: 80
      flow_ratio: 0.98
      # MVS 16 -> 11: sem fonte de MVS; classe do material (Orca mvs_default), política do menor valor
      max_volumetric_speed: 11
      diameter: 1.75
      drying_temperature: 65
      drying_time: 8.0
      recommendation: Referência mundial em PETG confiável
      color: Natural
      surface_finish: Standard
