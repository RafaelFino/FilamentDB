materials:
  PETG:
    profiles:
    - line: Basic Line
      commercial_name: PETG Basic
      profile_name: Futer3D PETG Basic
      export: true
      notes: >
        Produto comprado pelo usuário. Pesquisa web (remote_web_search, web_fetch) não
        localizou site oficial, loja nem TDS da Futer3D. Faixa de mesa (70-90) informada
        pelo usuário; faixa de bico corrigida para 230-260 (outlier de 270 identificado em
        auditoria comparativa com os demais PETG do catálogo). Fluxo e MVS são da CLASSE PETG adotada no projeto,
        NÃO do fabricante. Não encontrado: país,
        site, diâmetro/tolerância, peso, densidade, secagem, ventilação, cor, acabamento,
        preço, URL.
      nozzle:
        initial: 260
        min: 230
        max: 260
      # Faixas informadas pelo usuário (fonte: rótulo/página do produto): bico 230-260, mesa 70-90.
      # initial = max = 260: topo da faixa real de ficha (230-260; o valor 270 era outlier e foi corrigido
      # após auditoria comparativa com os demais PETG do catálogo) p/ combater sub-extrusão.
      bed:
        initial: 80
        temp: 80
      flow_ratio: 0.98
      # MVS: fabricante não declara (sem TDS); 11 = classe PETG do projeto (teto 12), menor valor por política de dúvida
      max_volumetric_speed: 11
      recommendation: >
        Sem datasheet público do fabricante, os parâmetros seguem a classe PETG conservadora
        do projeto (MVS 11). Seque o carretel antes de usar para evitar stringing. Calibrar
        flow e confirmar temperaturas pelo rótulo.
