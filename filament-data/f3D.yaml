        initial: 60
        temp: 60
      flow_ratio: 1.0
      max_volumetric_speed: 14
      recommendation: >
        PLA Premium nacional da F3D, foco em acabamento superficial e tolerância dimensional consistente. MVS conservador (14), sem efeito estático especial. Quando escolher: peças de uso geral e protótipos onde você quer um fio confiável de custo acessível.
        É PLA — nada de calor ou impacto forte. Opção sólida de fabricante nacional.
