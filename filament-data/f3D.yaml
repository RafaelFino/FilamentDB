  ABS:
    profiles:
    - line: High Temp Line
      commercial_name: ABS Industrial
      profile_name: F3D ABS
      nozzle:
        initial: 250
        min: 240
        max: 265
      bed:
        initial: 100
        temp: 100
      flow_ratio: 1.0
      max_volumetric_speed: 10
      recommendation: >
        ABS Industrial da F3D para peças resistentes a calor (~100°C) e impacto. Na K2 exige câmara fechada e cama 100°C — sem isso, empena e delamina. Libera VOC, ventile. Quando escolher: peças funcionais internas que esquentem. Para exterior/sol, use ASA (ABS amarelará no UV). Não é material para peça grande sem enclosure decente.
      color: Black
      surface_finish: Standard
      drying_temperature: 80
      drying_time: 6.0
      variants:
      - sku: F3D-ABS-BLK-1K
        color_name: Black
        hex: '#111111'
        rgb: [17, 17, 17]
        finish: Gloss
        diameter_mm: 1.75
        weight_g: 1000
        dry_temp: 80
        dry_hours: 6.0
        recommended_use: Engineering
        status: Active
  ASA:
    profiles:
    - line: High Temp Line
      commercial_name: ASA Outdoor
      profile_name: F3D ASA
      nozzle:
        initial: 255
        min: 245
        max: 270
      bed:
        initial: 100
        temp: 100
      flow_ratio: 1.0
      max_volumetric_speed: 10
      recommendation: >
        ASA da F3D para peças externas: resistência UV excelente, não amarela ao sol como o ABS. Mesmo comportamento de impressão do ABS — câmara fechada, cama 100°C, propenso a warping. Quando escolher: suportes externos, peças de jardim/varanda, qualquer coisa exposta ao tempo. Se a peça fica dentro de casa, o ABS resolve mais barato.
      color: White
      surface_finish: Standard
      drying_temperature: 80
      drying_time: 6.0
      variants:
      - sku: F3D-ASA-GRY-1K
        color_name: Gray
        hex: '#808080'
        rgb: [128, 128, 128]
        finish: Matte
        diameter_mm: 1.75
        weight_g: 1000
        dry_temp: 80
        dry_hours: 6.0
        recommended_use: Outdoor use
        status: Active
  TPU:
    profiles:
    - line: Flex Line
      commercial_name: TPU 95A
      profile_name: F3D TPU
      nozzle:
        initial: 225
        min: 215
        max: 235
      bed:
        initial: 50
        temp: 50
      flow_ratio: 1.05
      max_volumetric_speed: 8
      recommendation: >
        TPU 95A da F3D para peças flexíveis (juntas, protetores, pés). Velocidade baixa obrigatória (MVS 8) e retração mínima — o Direct Drive da K2 ajuda, mas não force. Seque antes: TPU pega umidade e bolha. Quando escolher: qualquer peça que precise dobrar/amortecer. Firme-flexível (95A), não é mole tipo borracha.
      color: Natural
      surface_finish: Flexible
      drying_temperature: 50
      drying_time: 8.0
      variants:
      - sku: F3D-TPU-BLK-1K
        color_name: Black
        hex: '#111111'
        rgb: [17, 17, 17]
        finish: Semi-Gloss
        diameter_mm: 1.75
        weight_g: 1000
        dry_temp: 50
        dry_hours: 8.0
        recommended_use: Flexible parts
        status: Active
