    - line: Industrial Line
      commercial_name: PETG Standard
      profile_name: F3D PETG
      nozzle:
        initial: 245
        min: 235
        max: 255
      bed:
        initial: 80
        temp: 80
      flow_ratio: 0.98
      max_volumetric_speed: 12
      recommendation: >
        PETG da linha Industrial da F3D para peças funcionais: boa resistência mecânica e estabilidade dimensional. Fluxo comum (MVS 12). Gruda em suporte como todo PETG, stringing se é úmido — seque antes. Quando escolher: suportes, caixas e peças utilitárias que sofrerem esforço ou calor moderado. Material funcional padrão da F3D.
