manufacturer:
  name: F3D
  country: Brazil
  website: https://www.filamentos3dbrasil.com.br/
  notes: Fabricante brasileiro de filamentos para impressão 3D. Linha ampla de materiais para uso geral e engenharia.
lines:
- name: Standard Line
  description: General purpose filaments with good balance between cost and quality
  positioning: balanced
  difficulty: 45
  target_use: general_printing
  tier: standard
  category: general
  finish: standard
  notes: Linha base da F3D, foco em consistência
  color_options:
  - Natural
  - Black
- name: Premium Line
  description: Improved surface finish and dimensional stability PLA/PETG
  positioning: improved_quality
  difficulty: 50
  target_use: better_surface_finish
  tier: premium
  category: general
  finish: standard
  tracking: true
  notes: Melhor controle de acabamento e tolerância dimensional; linha prioritária para monitoramento de preços
  color_options:
  - Natural
  - Black
- name: Industrial Line
  description: Engineering materials for functional and mechanical parts
  positioning: functional
  difficulty: 65
  target_use: mechanical_parts
  tier: premium
  category: mechanical
  finish: standard
  tracking: true
  notes: Linha de maior resistência mecânica e estabilidade térmica; inclui o PETG F3D monitorado
  color_options:
  - Black
  - White
  - Natural
- name: High Temp Line
  description: Materials optimized for higher temperature resistance applications
  positioning: engineering
  difficulty: 70
  target_use: heat_resistant_parts
  tier: premium
  category: high_temp
  finish: standard
  notes: Voltado para ABS/ASA e aplicações mais exigentes
  color_options:
  - Natural
  - Black
- name: Flex Line
  description: TPU flexible materials
  positioning: flexible
  difficulty: 80
  target_use: flexible_parts
  tier: standard
  category: flexible
  finish: standard
  notes: Impressão lenta e controle rigoroso de retração
  color_options:
  - Natural
  - Black
  - Gray
