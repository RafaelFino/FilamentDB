manufacturer:
  name: Brasfila
  country: Brazil
  website: https://www.brasfila.com.br
  notes: >
    Fabricante brasileiro de Londrina/PR. Foco em preço acessível (~R$97/kg PLA Premium).
    Tolerância ±0.05mm. Linhas: PLA Premium (sólido, silk, metalizado), PETG Premium.
    Posicionamento entry-level — não otimizado para alta velocidade.
    Nozzle recomendado 190-210°C, bed 0-60°C.
lines:
