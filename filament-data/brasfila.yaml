  difficulty: 40
  target_use: general_printing
  notes: >
    PLA Premium da Brasfila. Tolerância ±0.05mm. Nozzle 190-210°C.
    Preço acessível (~R$97/kg). Boa variedade de cores sólidas.
  color_options:
  - Black
  - White
  - Red
  - Blue
  - Green
  - Yellow
  - Orange
  - Pink
  - Purple
