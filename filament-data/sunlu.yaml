materials:
  PLA:
    profiles:
    - line: PLA Standard Line
      commercial_name: PLA
      profile_name: Sunlu PLA
      nozzle:
        initial: 215
        min: 205
        max: 230
      bed:
        initial: 60
        temp: 60
      flow_ratio: 1.0
      max_volumetric_speed: 14
      recommendation: >
        PLA básico e barato da Sunlu, o cavalo de batalha para protótipos e peças descartáveis.
        Imprime sem exigência, MVS conservador (14). Acabamento e resistência são medianos.
        Quando escolher: rascunhos, testes de encaixe, qualquer coisa onde custo baixo importa
        mais que qualidade. Para peça final ou estética, suba para PLA+ ou Meta.
      color: Natural
      surface_finish: Standard
    - line: PLA+ Line
      commercial_name: PLA+
      profile_name: Sunlu PLA+
      nozzle:
        initial: 220
        min: 210
        max: 235
      bed:
        initial: 60
        temp: 60
      flow_ratio: 1.02
      max_volumetric_speed: 15
      recommendation: >
        PLA+ tem mais tenacidade que o PLA comum — quebra menos ao impacto, aguenta rosca e encaixe.
        Bom meio-termo entre facilidade do PLA e durabilidade. Quando escolher: peças que sofrem
        um pouco de esforço mas não justificam PETG (clipes, suportes leves, engrenagens de baixa carga).
        Continua sendo PLA: nada de calor. É o PLA que uso quando a peça vai ser manuseada.
      color: Natural
      surface_finish: Standard
    - line: High Speed Line
      commercial_name: PLA High Speed
      profile_name: Sunlu PLA High Speed
      export: true
      nozzle:
        initial: 220
        min: 210
        max: 230
      bed:
        initial: 55
        temp: 55
      flow_ratio: 0.98
      max_volumetric_speed: 22
      density: 1.28
      glass_transition_temp: 54
      heat_deflection_temp: 57
      tensile_strength_mpa: 39
      flexural_strength_mpa: 70
      impact_strength_kj_m2: 4.5
      elongation_at_break_pct: 12
      mfi_g_10min: 7
      diameter_tolerance: "1.75±0.02mm"
      recommendation: >
        PLA de alta velocidade da Sunlu, feito para produção rápida (datasheet cita até 600mm/s;
        MVS 22 na K2). Bom custo por rolo e ampla paleta de cores. Tensile 39 MPa é mais baixo
        que o PLA+ — priorize velocidade, não resistência. Quando escolher: lotes, peças grandes,
        protótipos onde tempo manda. Datasheet: density 1.28, Vicat 54°C, HDT 57°C, flexural 70 MPa.
      surface_finish: Standard
      variants:
      - color: Red
        hex: "#CC2200"
      - color: White
        hex: "#F5F5F5"
      - color: Black
        hex: "#1C1C1C"
      - color: Yellow
        hex: "#F5C518"
      - color: Green
        hex: "#2E8B57"
      - color: Grey
        hex: "#808080"
      - color: Pink
        hex: "#FF91A4"
      - color: Sunny Orange
        hex: "#FF6E31"
      - color: Olive Green
        hex: "#808000"
      - color: Sky Blue
        hex: "#87CEEB"
      - color: Coral Pink
        hex: "#F88379"
      - color: Jelly Green
        hex: "#39E75F"
      - color: Klein Blue
        hex: "#002FA7"
      - color: Lavender Purple
        hex: "#9C64D6"
      - color: Mocha Mousse
        hex: "#A67B5B"
    - line: Meta Line
      commercial_name: PLA Meta
      profile_name: Sunlu PLA Meta
      notes: >
        Specs oficiais: nozzle 185-195°C a 50-100mm/s ou 195-225°C a 100-200mm/s.
        Density 1.21 g/cm³, Vicat 54°C, HDT 57°C, tensile 50±5 MPa, flexural 85±6 MPa,
        MFI 5±2 g/10min. Cores pastéis (macaron). Tolerância 1.75±0.02mm.
      nozzle:
        initial: 210
        min: 185
        max: 225
      bed:
        initial: 55
        temp: 55
      flow_ratio: 1.01
      max_volumetric_speed: 18
      density: 1.21
      glass_transition_temp: 54
      heat_deflection_temp: 57
      tensile_strength_mpa: 50
      flexural_strength_mpa: 85
      mfi_g_10min: 5
      diameter_tolerance: "1.75±0.02mm"
      recommendation: >
        PLA Meta combina bom acabamento (cores pastel macaron) com fluxo alto que imprime bem
        até em temperatura mais baixa. Melhor tensile da linha PLA da Sunlu (50 MPa) e density
        baixa (1.21) — rende mais metros por rolo. Quando escolher: peças decorativas em tons suaves
        que também precisam de alguma resistência. É o PLA "premium" da Sunlu para o dia a dia.
      surface_finish: Standard
      variants:
      - color: Grey
        hex: "#808080"
      - color: Black
        hex: "#1C1C1C"
      - color: Teal
        hex: "#008080"
      - color: Cream White
        hex: "#FFFDD0"
      - color: Cherry Red
        hex: "#DC143C"
      - color: Sunny Orange
        hex: "#FF6E31"
      - color: Lemon Yellow
        hex: "#FFF44F"
      - color: Olive Green
        hex: "#808000"
      - color: Mint Green
        hex: "#98FF98"
      - color: Sky Blue
        hex: "#87CEEB"
      - color: Taro Purple
        hex: "#9C7EB5"
      - color: Sakura Pink
        hex: "#FF91A4"
      - color: Chocolate
        hex: "#7B3F00"
      - color: White
        hex: "#F5F5F5"
      - color: Ice Blue
        hex: "#99C5C4"
      - color: Apple Green
        hex: "#8DB600"
    - line: Silk Line
      commercial_name: PLA Silk
      profile_name: Sunlu PLA Silk
      nozzle:
        initial: 225
        min: 215
        max: 240
      bed:
        initial: 60
        temp: 60
      flow_ratio: 1.05
      max_volumetric_speed: 12
      recommendation: >
        PLA silk brilhante para peças decorativas (inclui cores metálicas e rainbow). O brilho
        realça a geometria mas denuncia falhas de camada e costura — cuide do seam. MVS 12 pede
        velocidade moderada. Quando escolher: enfeites, presentes, vasos. Camada entre camadas é mais
        fraca que PLA comum (silk sacrifica adesão) — evite peças que sofram esforço.
      color: Natural
      surface_finish: Silky
    - line: PLA Matte Line
      commercial_name: PLA Matte
      profile_name: Sunlu PLA Matte
      nozzle:
        initial: 210
        min: 195
        max: 225
      bed:
        initial: 55
        temp: 55
      flow_ratio: 1.01
      max_volumetric_speed: 14
      density: 1.24
      recommendation: >
        PLA fosco da Sunlu: acabamento matte uniforme que disfarça linhas de camada, sem brilho.
        Fácil de imprimir como PLA comum. Quando escolher: peças à mostra que pedem visual discreto
        e homogêneo. É PLA — sem calor nem esforço mecânico.
      color: White
      surface_finish: Matte
      drying_temperature: 50
      drying_time: 8.0
      variants:
      - color_name: White
        hex: "#F4F4F2"
        finish: Matte
        weight_g: 1000
        status: Active
      - color_name: Black
        hex: "#101010"
        finish: Matte
        weight_g: 1000
        status: Active
  PETG:
    profiles:
    - line: PETG Line
      commercial_name: PETG
      profile_name: Sunlu PETG
      nozzle:
        initial: 245
        min: 235
        max: 255
      bed:
        initial: 80
        temp: 80
      flow_ratio: 0.98
      max_volumetric_speed: 12
      recommendation: >
        PETG padrão da Sunlu para peças funcionais: resistência química e mecânica boas,
        aguenta calor moderado. Fluxo comum (MVS 12), acabamento sem efeito. Como todo PETG,
        gruda em suporte e faz stringing se úmido — seque antes. Quando escolher: peças utilitárias
        do dia a dia. Se quiser velocidade e acabamento matte, vá de PETG High Speed Matte.
      color: Natural
      surface_finish: Standard
    - line: PETG High Speed Matte Line
      commercial_name: PETG High Speed Matte
      profile_name: Sunlu PETG HS
      export: true
      notes: >
        PETG de alto fluxo com acabamento matte. MFR 4.4 g/10min — fluxo muito superior
        ao PETG padrão. Sensível à umidade: secar a 50°C, manter <20% RH.
        Nozzle escala por velocidade: 240-250°C @100-200mm/s, 260-270°C @300-600mm/s.
      nozzle:
        initial: 250
        min: 240
        max: 270
      bed:
        initial: 70
        temp: 70
      flow_ratio: 0.97
      max_volumetric_speed: 18
      density: 1.26
      heat_deflection_temp: 70
      melting_point: 128
      mfi_g_10min: 4.4
      tensile_strength_mpa: 48
      flexural_strength_mpa: 78
      flexural_modulus_mpa: 2700
      impact_strength_kj_m2: 4.1
      elongation_at_break_pct: 33
      diameter_tolerance: "1.75±0.02mm"
      drying_temperature: 50
      drying_time: 6.0
      recommendation: >
        O melhor PETG da Sunlu: alto fluxo (MVS 18, MFR 4.4) para velocidade + acabamento matte
        elegante que esconde camadas. Equivalente direto ao Voolt3D PETG HF. Melhores números
        mecânicos da linha (tensile 48, flexural 78 MPa). Ponto crítico: MUITO sensível à umidade —
        stringing severo se não estiver seco (<20% RH). Quando escolher: peças funcionais que
        também precisam parecer bem. É o meu PETG de referência para funcional+estético.
      color: Black
      surface_finish: Matte
      variants:
      - color: Black
        hex: "#000000"
      - color: White
        hex: "#FFFFFF"
      - color: Grey
        hex: "#75787B"
