  ABS:
    profiles:
    - line: ABS Line
      commercial_name: ABS
      profile_name: Sunlu ABS
      nozzle:
        initial: 250
        min: 240
        max: 265
      bed:
        initial: 100
        temp: 100
      flow_ratio: 1.0
      max_volumetric_speed: 10
      recommendation: >
        ABS da Sunlu para peças resistentes a calor e impacto. Na K2 só vale a pena com câmara
        fechada e cama 100°C — sem isso, empena. Libera VOC, ventile o ambiente. Quando escolher:
        peças que esquentam e precisam de tenacidade. Para exterior/sol prefira ASA. Não é material
        para iniciante nem para peça grande sem enclosure decente.
      color: Black
      surface_finish: Standard
  TPU:
    profiles:
    - line: TPU Line
      commercial_name: TPU 95A
      profile_name: Sunlu TPU
      nozzle:
        initial: 225
        min: 215
        max: 235
      bed:
        initial: 50
        temp: 50
      flow_ratio: 1.05
      max_volumetric_speed: 8
      recommendation: >
        TPU 95A flexível da Sunlu para juntas, protetores e peças que dobram. Velocidade baixa
        obrigatória (MVS 8) — o Direct Drive da K2 ajuda, mas force pouco. Retração mínima para
        evitar oozing. Seque bem antes: TPU absorve umidade e bolha. Quando escolher: qualquer peça
        elástica. Dureza 95A é firme-flexível (não é mole tipo borracha).
      color: Natural
      surface_finish: Flexible
