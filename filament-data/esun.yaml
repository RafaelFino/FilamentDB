manufacturer:
  name: eSUN
  country: China
  website: https://www.esun3d.com
  notes: >
    Fabricante internacional de filamentos para impressão 3D. Para o mercado brasileiro,
    há distribuição autorizada pela Esun Brasil e presença em marketplaces como Mercado Livre.
    Dados de produto e parâmetros conferidos em páginas oficiais da eSUN e em revendedor brasileiro.

