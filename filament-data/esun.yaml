materials:
  PLA:
    profiles:
    - line: PLA-Basic Line
      commercial_name: PLA-Basic
      profile_name: eSUN PLA-Basic
      nozzle:
        initial: 215
        min: 210
        max: 230
      bed:
        initial: 60
        temp: 60
      flow_ratio: 1.0
      max_volumetric_speed: 20
      density: 1.24
      glass_transition_temp: 54
      heat_deflection_temp: 53.65
      tensile_strength_mpa: 64.27
      flexural_strength_mpa: 106.8
      elongation_at_break_pct: 4.61
      mfi_g_10min: 6.48
      diameter_tolerance: "1.75±0.05mm"
      recommendation: >
        PLA-Basic é o ponto de entrada da eSUN: barato, fácil de imprimir e adequado para
        protótipos, modelos e peças de baixa exigência. Para produção rápida, prefira PLA+ HS.
      color: Grey
      surface_finish: Standard
      drying_temperature: 50
      drying_time: 8.0
    - line: PLA+ Line
      commercial_name: PLA+
      profile_name: eSUN PLA+
      nozzle:
        initial: 220
        min: 210
        max: 230
      bed:
        initial: 55
        temp: 55
      flow_ratio: 1.0
      max_volumetric_speed: 18
      density: 1.24
      heat_deflection_temp: 53.78
      tensile_strength_mpa: 70.37
      flexural_strength_mpa: 100.3
      elongation_at_break_pct: 4.14
      mfi_g_10min: 3.7
      diameter_tolerance: "1.75±0.05mm"
      recommendation: >
        PLA+ é a escolha funcional geral da eSUN: mais resistente que PLA comum sem perder a
        facilidade de impressão. Bom candidato a perfil padrão de uso diário na K2.
      color: Black
      surface_finish: Standard
      drying_temperature: 50
      drying_time: 8.0
    - line: PLA+ HS Line
      commercial_name: PLA+ HS
      profile_name: eSUN PLA+ HS
      nozzle:
        initial: 220
        min: 210
        max: 230
      bed:
        initial: 55
        temp: 55
      flow_ratio: 1.0
      max_volumetric_speed: 24
      density: 1.24
      tensile_strength_mpa: 64.0
      flexural_strength_mpa: 83.0
      flexural_modulus_mpa: 2900
      elongation_at_break_pct: 4.01
      diameter_tolerance: "1.75±0.05mm"
      recommendation: >
        PLA+ HS é a opção eSUN para aproveitar a capacidade de alta velocidade da K2. O limite
        volumétrico é deliberadamente alto, mas o slicer deve continuar limitando pelo menor valor
        entre processo e filamento.
      color: Pine Green
      surface_finish: Standard
      drying_temperature: 50
      drying_time: 8.0
    - line: ePLA Matte Line
      commercial_name: ePLA Matte
      profile_name: eSUN ePLA Matte
      nozzle:
        initial: 210
        min: 190
        max: 230
      bed:
        initial: 50
        temp: 50
      flow_ratio: 1.0
      max_volumetric_speed: 16
      density: 1.329
      heat_deflection_temp: 51
      tensile_strength_mpa: 25.976
      flexural_strength_mpa: 42.6
      flexural_modulus_mpa: 2249.05
      elongation_at_break_pct: 7.23
      mfi_g_10min: 5.8
      recommendation: >
        ePLA Matte é focado em acabamento visual fosco e facilidade de impressão. Excelente para
        modelos decorativos e peças onde as linhas de camada devem ficar menos aparentes.
      color: Dark Grey
      surface_finish: Matte
    - line: PLA-CF Line
      commercial_name: PLA-CF
      profile_name: eSUN PLA-CF
      nozzle:
        initial: 215
        min: 190
        max: 230
      bed:
        initial: 55
        temp: 55
      flow_ratio: 1.0
      max_volumetric_speed: 15
      flexural_modulus_mpa: 5431
      recommendation: >
        PLA-CF para peças rígidas e estruturais. Use bico de aço endurecido: a fibra de carbono é
        abrasiva. Velocidade menor que PLA/PLA+ para preservar qualidade e segurança do conjunto.
      color: Black
      surface_finish: Matte
      drying_temperature: 50
      drying_time: 8.0
  PETG:
    profiles:
    - line: PETG-Basic Line
      commercial_name: PETG-Basic
      profile_name: eSUN PETG-Basic
      nozzle:
        initial: 245
        min: 230
        max: 250
      bed:
        initial: 75
        temp: 75
      flow_ratio: 0.98
      max_volumetric_speed: 12
      heat_deflection_temp: 73
      recommendation: >
        PETG-Basic é a opção funcional de entrada da eSUN: boa adesão, resistência a água e
        impacto, estabilidade dimensional e acabamento brilhante. Como todo PETG, mantenha seco.
      color: Black
      surface_finish: Standard
      drying_temperature: 55
      drying_time: 6.0
    - line: PETG HS Line
      commercial_name: PETG HS
      profile_name: eSUN PETG HS
      nozzle:
        initial: 245
        min: 220
        max: 260
      bed:
        initial: 80
        temp: 80
      flow_ratio: 0.98
      max_volumetric_speed: 18
      recommendation: >
        PETG HS para alta velocidade, com resfriamento rápido e boa resistência mecânica e química.
        No perfil da K2, comece conservador e aumente velocidade apenas após validar cooling e MVS.
      color: Green
      surface_finish: Standard
      drying_temperature: 55
      drying_time: 6.0
  ABS:
    profiles:
    - line: ABS+ Line
      commercial_name: ABS+
      profile_name: eSUN ABS+
      nozzle:
        initial: 250
        min: 240
        max: 270
      bed:
        initial: 100
        temp: 100
      flow_ratio: 1.0
      max_volumetric_speed: 12
      density: 1.04
      heat_deflection_temp: 89
      tensile_strength_mpa: 33
      recommendation: >
        ABS+ para peças robustas e resistentes ao calor. Use a câmara fechada da K2, mantenha o
        ambiente estável e ventile adequadamente. Menor contração e odor que ABS convencional,
        mas continua sendo material de alta temperatura.
      color: Black
      surface_finish: Standard
      drying_temperature: 70
      drying_time: 6.0
