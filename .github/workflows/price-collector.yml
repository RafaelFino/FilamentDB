name: Daily price collection

on:
  schedule:
    # 03:30 America/Sao_Paulo (06:30 UTC). GitHub schedules are UTC.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional snapshot date (YYYY-MM-DD). Leave empty for SÃ£o Paulo today.'
        required: false
        type: string
        default: ''
      replace:
        description: 'Allow replacing an existing snapshot (use only for deliberate corrections).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependency
        run: python -m pip install --upgrade openai google-genai

      - name: Collect daily prices
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_PRICE_MODEL || 'gpt-5.6-luna' }}
          GROQ_MODEL: ${{ vars.GROQ_PRICE_MODEL || 'groq/compound-mini' }}
          GEMINI_MODEL: ${{ vars.GEMINI_PRICE_MODEL || 'gemini-3.6-flash' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_PRICE_MODEL || 'openrouter/free' }}
          OPENROUTER_ENABLE_WEB_SEARCH: '1'
          PRICE_AGENT_BATCH_SIZE: ${{ vars.PRICE_AGENT_BATCH_SIZE || '2' }}
          ALLOW_SNAPSHOT_REPLACE: ${{ inputs.replace && '1' || '' }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python scripts/collect_prices_ai.py --date "${{ inputs.date }}"
          else
            python scripts/collect_prices_ai.py
          fi

      - name: Validate snapshot
        run: python scripts/validate_price_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "FilamentDB Price Agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/price-data/*.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteraÃ§Ã£o de snapshot para publicar."
            exit 0
          fi
          git commit -m "data: daily price snapshot $(date -u +%Y-%m-%d)"
          git push origin main
