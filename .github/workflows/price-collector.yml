name: Daily price collection

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Número de perfis a testar; 0 = catálogo completo.'
        required: false
        type: number
        default: 0
      date:
        description: 'Optional snapshot date (YYYY-MM-DD). Leave empty for São Paulo today.'
        required: false
        type: string
        default: ''
      replace:
        description: 'Descartar o snapshot do dia e recomeçar do zero. Padrão (false) faz merge idempotente com o snapshot existente.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: python -m pip install --upgrade -r requirements.txt openai ddgs

      - name: Build catalog database
        run: python build.py --only-db

      - name: Collect daily price snapshot with AI agents
        env:
          PYTHONUNBUFFERED: "1"
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_PRICE_MODEL || 'mistral-small-latest' }}
          GEMINI_MODEL: ${{ vars.GEMINI_PRICE_MODEL || 'gemini-3.7-flash' }}
          FILAMENTDB_API_URL: ${{ vars.FILAMENTDB_API_URL || 'https://filamentdb-api.learnops.duckdns.org' }}
          FILAMENTDB_API_SECRET: ${{ secrets.FILAMENTDB_API_SECRET }}
          PRICE_AGENT_MAX_PROFILES: ${{ inputs.limit || '0' }}
          PRICE_AGENT_PROVIDERS: ${{ vars.PRICE_AGENT_PROVIDERS || 'mistral,gemini' }}
          PRICE_AGENT_MAX_TURNS: ${{ vars.PRICE_AGENT_MAX_TURNS || '30' }}
          PRICE_AGENT_LLM_RETRIES: ${{ vars.PRICE_AGENT_LLM_RETRIES || '3' }}
          PRICE_AGENT_LLM_BACKOFF: ${{ vars.PRICE_AGENT_LLM_BACKOFF || '5' }}
          ALLOW_SNAPSHOT_REPLACE: ${{ inputs.replace && '1' || '' }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python scripts/collect_prices_agent.py --date "${{ inputs.date }}"
          else
            python scripts/collect_prices_agent.py
          fi

      - name: Validate snapshot
        run: python scripts/validate_price_snapshot.py

      - name: Publish validated snapshot to ingest API
        env:
          FILAMENTDB_API_URL: ${{ vars.FILAMENTDB_API_URL || 'https://filamentdb-api.learnops.duckdns.org' }}
          FILAMENTDB_API_SECRET: ${{ secrets.FILAMENTDB_API_SECRET }}
        run: python scripts/publish_price_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "FilamentDB Price Agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/price-data/*.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de snapshot para publicar."
            exit 0
          fi
          git commit -m "data: daily price snapshot $(date -u +%Y-%m-%d)"
          git push origin main
